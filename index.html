<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PayXchange — Scan it. Pay it. Done.</title>
<meta name="description" content="PayXchange, a product of Shifa Ltd, turns any code into an instant payment. Scan to pay friends or shops, straight to a Nigerian bank account. Android beta out now, iOS coming soon." />

<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Shifa Ltd",
  "url": "https://payxchange.app",
  "email": "hello@payxchange.app",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "3 Fabajo Close, Oko Oba, off Emmanuel Bus Stop, opposite Maple Wood Estate",
    "addressLocality": "Agege",
    "addressRegion": "Lagos State",
    "addressCountry": "NG"
  },
  "makesOffer": {
    "@type": "Offer",
    "itemOffered": { "@type": "MobileApplication", "name": "PayXchange", "applicationCategory": "FinanceApplication" }
  }
}
</script>

<style>
  :root{
    --ink:#0A0E20; --ink2:#0C1128; --surface:#141A38; --surface2:#1A2148;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14);
    --text:#EEF0FA; --muted:#98A0C6; --dim:#6B73A0;
    --primary:#6D5EF6; --primary2:#B84DF0; --accent:#38E8A0; --accent-ink:#04371F;
    --grad:linear-gradient(135deg,#6D5EF6 0%,#B84DF0 100%);
    --display:'Clash Display',sans-serif; --body:'Satoshi',sans-serif; --mono:'Space Mono',monospace;
    --maxw:1160px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);background:var(--ink);color:var(--text);
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--primary);color:#fff}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .section{padding:110px 0}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
  .mono{font-family:var(--mono)}

  /* ---------- background atmosphere ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .bg .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .bg .g1{width:620px;height:620px;background:#5B4BE0;top:-260px;left:-140px}
  .bg .g2{width:540px;height:540px;background:#9B3BD6;top:-180px;right:-160px;opacity:.4}
  .bg .grid{position:absolute;inset:0;background-image:
     linear-gradient(var(--line) 1px,transparent 1px),
     linear-gradient(90deg,var(--line) 1px,transparent 1px);
     background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 0%,transparent 70%);opacity:.5}

  /* ---------- nav ---------- */
  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
     background:rgba(10,14,32,.6);border-bottom:1px solid transparent;transition:border-color .3s}
  nav.scrolled{border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:70px}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
  .badge{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;
     font-family:var(--display);font-weight:700;font-size:15px;color:#fff;box-shadow:0 6px 20px rgba(109,94,246,.45)}
  .nav-links{display:flex;align-items:center;gap:34px}
  .nav-links a{font-size:15px;color:var(--muted);transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .btn{font-family:var(--body);font-weight:700;font-size:15px;border:none;cursor:pointer;
     border-radius:12px;padding:12px 20px;transition:transform .15s,box-shadow .2s,background .2s}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(109,94,246,.4)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(140,77,240,.5)}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line2)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .nav-links .btn{padding:10px 18px}
  .menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer}

  /* ---------- hero ---------- */
  .hero{padding:64px 0 90px;position:relative}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
  .hero h1{font-family:var(--display);font-weight:600;line-height:.98;letter-spacing:-.03em;
     font-size:clamp(3rem,7vw,5.4rem);margin:22px 0 0}
  .hero h1 .w{display:inline-block;opacity:0;transform:translateY(20px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .hero h1 .w2{animation-delay:.12s}.hero h1 .w3{animation-delay:.24s}
  .hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes rise{to{opacity:1;transform:none}}
  .hero p.sub{color:var(--muted);font-size:clamp(1.05rem,1.6vw,1.28rem);max-width:520px;margin:26px 0 34px;line-height:1.55;
     opacity:0;animation:rise .7s ease .4s forwards}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:rise .7s ease .55s forwards}
  .store{display:flex;align-items:center;gap:11px;padding:11px 18px;border-radius:14px;border:1px solid var(--line2);
     background:rgba(255,255,255,.04);position:relative;transition:border-color .2s,background .2s}
  .store:hover{border-color:var(--line2);background:rgba(255,255,255,.08)}
  .store svg{width:26px;height:26px;flex:none}
  .store .st{display:flex;flex-direction:column;line-height:1.15}
  .store .st small{font-size:11px;color:var(--dim)}
  .store .st b{font-family:var(--display);font-weight:600;font-size:16px}
  .store .soon{position:absolute;top:-9px;right:10px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
     background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:20px;font-weight:700}
  .store .soon.live{background:var(--accent);color:var(--accent-ink)}
  a.store{cursor:pointer}
  .store.disabled{opacity:.6}
  .install-hint{color:var(--dim);font-size:12.5px;margin-top:14px;max-width:420px;line-height:1.5}
  .install-hint b{color:var(--muted);font-weight:700}
  .notify{margin-top:26px;opacity:0;animation:rise .7s ease .7s forwards}
  .notify form{display:flex;gap:9px;max-width:420px;background:rgba(255,255,255,.05);border:1px solid var(--line2);
     border-radius:14px;padding:6px;transition:border-color .2s}
  .notify form:focus-within{border-color:var(--primary)}
  .notify input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--body);font-size:15px;padding:0 12px}
  .notify input::placeholder{color:var(--dim)}
  .notify .btn{padding:11px 18px}
  .notify .done{display:flex;align-items:center;gap:9px;color:var(--accent);font-weight:500;font-size:15px;padding:12px 6px}
  .notify .hint{color:var(--dim);font-size:13px;margin-top:11px}

  /* ---------- phone / scan demo (signature) ---------- */
  .demo{display:grid;place-items:center;opacity:0;animation:rise .9s ease .5s forwards}
  .phone{position:relative;width:288px;height:590px;border-radius:44px;padding:13px;
     background:linear-gradient(160deg,#20264a,#0d1128);
     box-shadow:0 40px 90px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06),inset 0 0 0 2px rgba(255,255,255,.03)}
  .phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
     width:120px;height:26px;background:#05070f;border-radius:16px;z-index:5}
  .screen{width:100%;height:100%;border-radius:32px;overflow:hidden;position:relative;
     background:radial-gradient(120% 90% at 50% 0%,#141a38 0%,#0a0e20 60%)}
  .screen .top{position:absolute;top:0;left:0;right:0;padding:20px 22px 0;display:flex;justify-content:space-between;
     font-family:var(--mono);font-size:11px;color:var(--muted);z-index:4}
  .scan-view,.ok-view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
     transition:opacity .5s,transform .5s}
  .scan-view{gap:26px}
  .scan-cap{font-family:var(--display);font-weight:500;font-size:16px;color:var(--text)}
  .scan-sub{color:var(--dim);font-size:12.5px;margin-top:-16px;font-family:var(--mono);letter-spacing:.05em}
  .qr-frame{position:relative;width:200px;height:200px;border-radius:22px;background:#fff;padding:16px;
     box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .corner{position:absolute;width:30px;height:30px;border:3px solid var(--accent)}
  .corner.tl{top:-6px;left:-6px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
  .corner.tr{top:-6px;right:-6px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
  .corner.bl{bottom:-6px;left:-6px;border-right:none;border-top:none;border-radius:0 0 0 8px}
  .corner.br{bottom:-6px;right:-6px;border-left:none;border-top:none;border-radius:0 0 8px 0}
  .laser{position:absolute;left:8px;right:8px;height:3px;border-radius:3px;top:16px;
     background:linear-gradient(90deg,transparent,var(--accent),transparent);
     box-shadow:0 0 14px 3px rgba(56,232,160,.7);animation:scan 2.1s ease-in-out infinite}
  @keyframes scan{0%{top:16px}50%{top:180px}100%{top:16px}}
  .pxbadge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:12px;
     background:var(--grad);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:18px;
     box-shadow:0 4px 14px rgba(109,94,246,.5),0 0 0 4px #fff}
  .ok-view{gap:16px;opacity:0;transform:scale(.96);pointer-events:none}
  .check{width:92px;height:92px;border-radius:50%;background:rgba(56,232,160,.12);display:grid;place-items:center;
     border:1px solid rgba(56,232,160,.35)}
  .check .c2{width:60px;height:60px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
  .ok-title{font-family:var(--display);font-weight:600;font-size:19px}
  .ok-amt{font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:-.02em}
  .ok-to{color:var(--muted);font-size:13.5px;margin-top:-8px}
  .ok-chip{margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
     color:var(--accent);background:rgba(56,232,160,.1);border:1px solid rgba(56,232,160,.25);padding:5px 12px;border-radius:20px}
  .phone.paid .scan-view{opacity:0;transform:scale(1.04)}
  .phone.paid .ok-view{opacity:1;transform:scale(1)}

  /* ---------- how it works ---------- */
  .head{max-width:640px}
  .head h2{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4vw,3.1rem);line-height:1.05;letter-spacing:-.02em;margin:16px 0 0}
  .head p{color:var(--muted);font-size:1.1rem;margin-top:16px;line-height:1.6}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:56px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;position:relative;overflow:hidden}
  .step .n{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.1em}
  .step h3{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:16px 0 10px}
  .step p{color:var(--muted);font-size:.98rem;line-height:1.55}
  .step .line{position:absolute;top:0;left:0;height:3px;width:100%;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .6s}
  .step.in .line{transform:scaleX(1)}
  .step .ic{width:46px;height:46px;border-radius:12px;background:rgba(109,94,246,.14);border:1px solid rgba(109,94,246,.3);
     display:grid;place-items:center;color:#b7aefc;margin-top:20px}

  /* ---------- features ---------- */
  .feat{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;margin-top:56px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;transition:transform .25s,border-color .25s,background .25s}
  .card:hover{transform:translateY(-4px);border-color:var(--line2);background:var(--surface2)}
  .card .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;margin-bottom:20px}
  .card h3{font-family:var(--display);font-weight:600;font-size:1.28rem;margin-bottom:10px;letter-spacing:-.01em}
  .card p{color:var(--muted);font-size:1rem;line-height:1.55}
  .card.big{grid-column:span 3;background:
     radial-gradient(120% 140% at 100% 0%,rgba(109,94,246,.22),transparent 60%),var(--surface)}
  .card.small{grid-column:span 3}
  @media(min-width:861px){.feat .card.small{grid-column:span 2}}
  .ic-primary{background:rgba(109,94,246,.16);border:1px solid rgba(109,94,246,.32);color:#bcb2fd}
  .ic-accent{background:rgba(56,232,160,.12);border:1px solid rgba(56,232,160,.3);color:var(--accent)}

  /* ---------- security band ---------- */
  .band{background:linear-gradient(180deg,var(--ink2),var(--ink));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
  .sec-list{display:flex;flex-direction:column;gap:20px;margin-top:8px}
  .sec-item{display:flex;gap:15px;align-items:flex-start}
  .sec-item .dot{width:38px;height:38px;border-radius:11px;flex:none;background:rgba(56,232,160,.1);border:1px solid rgba(56,232,160,.25);
     display:grid;place-items:center;color:var(--accent)}
  .sec-item b{font-family:var(--display);font-weight:600;font-size:1.08rem}
  .sec-item p{color:var(--muted);font-size:.97rem;margin-top:3px;line-height:1.5}
  .vault{aspect-ratio:1;border-radius:28px;border:1px solid var(--line);position:relative;overflow:hidden;
     background:radial-gradient(90% 90% at 50% 20%,rgba(109,94,246,.2),transparent 60%),var(--surface);display:grid;place-items:center}
  .vault .shield{width:120px;height:120px;border-radius:30px;background:var(--grad);display:grid;place-items:center;color:#fff;
     box-shadow:0 30px 70px -18px rgba(109,94,246,.6)}
  .vault .ring{position:absolute;border:1px solid var(--line2);border-radius:50%}
  .vault .r1{width:58%;height:58%;animation:spin 26s linear infinite}
  .vault .r2{width:80%;height:80%;animation:spin 40s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- faq ---------- */
  .faq{max-width:820px;margin:52px auto 0}
  .q{border-bottom:1px solid var(--line);padding:4px 0}
  .q button{width:100%;background:none;border:none;color:var(--text);cursor:pointer;text-align:left;
     display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 4px;
     font-family:var(--display);font-weight:500;font-size:1.18rem}
  .q .plus{flex:none;width:26px;height:26px;color:var(--primary2);transition:transform .3s}
  .q.open .plus{transform:rotate(45deg)}
  .q .a{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .q .a p{color:var(--muted);font-size:1.02rem;line-height:1.6;padding:0 4px 24px}

  /* ---------- final cta ---------- */
  .final{position:relative;text-align:center;border-radius:32px;padding:80px 40px;overflow:hidden;
     background:radial-gradient(120% 130% at 50% 0%,rgba(184,77,240,.28),transparent 55%),var(--surface);border:1px solid var(--line2)}
  .final h2{font-family:var(--display);font-weight:600;font-size:clamp(2.1rem,4.6vw,3.4rem);letter-spacing:-.02em;line-height:1.05}
  .final p{color:var(--muted);font-size:1.15rem;margin:18px auto 34px;max-width:520px}
  .final .cta-row{justify-content:center;animation:none;opacity:1}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:64px 0 40px;margin-top:110px}
  .foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px}
  .foot-brand p{color:var(--muted);font-size:.96rem;margin:16px 0 20px;max-width:280px;line-height:1.55}
  .byline{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 12px;border-radius:20px;
     border:1px solid var(--line2);background:rgba(255,255,255,.04);
     font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .byline b{color:var(--text);font-weight:700}
  .byline .sh{width:18px;height:18px;border-radius:6px;background:var(--grad);display:grid;place-items:center;
     font-family:var(--display);font-size:9px;font-weight:700;color:#fff;letter-spacing:0}
  address.addr{font-style:normal;display:flex;gap:11px;align-items:flex-start;max-width:290px;
     color:var(--muted);font-size:.92rem;line-height:1.55;margin:0 0 22px}
  address.addr .pin{flex:none;margin-top:2px;color:var(--dim)}
  address.addr h5{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
     color:var(--dim);font-weight:400;margin-bottom:6px}
  .socials{display:flex;gap:12px}
  .socials a{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);transition:.2s}
  .socials a:hover{color:var(--text);border-color:var(--primary);background:rgba(109,94,246,.12)}
  .fcol h4{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
  .fcol a{display:block;color:var(--muted);font-size:.97rem;margin-bottom:13px;transition:color .2s}
  .fcol a:hover{color:var(--text)}
  .soon-tag{font-family:var(--mono);font-size:9px;color:var(--accent-ink);background:var(--accent);padding:1px 6px;border-radius:10px;margin-left:7px;letter-spacing:.05em}
  .foot-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:52px;padding-top:26px;border-top:1px solid var(--line);
     color:var(--dim);font-size:.9rem;flex-wrap:wrap;gap:12px}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  @media(max-width:860px){
    .nav-links{display:none}.menu-btn{display:block}
    .hero-grid{grid-template-columns:1fr;gap:48px}
    .demo{order:-1}
    .steps{grid-template-columns:1fr}
    .feat{grid-template-columns:1fr}.card.big,.card.small{grid-column:span 1}
    .sec-grid{grid-template-columns:1fr;gap:36px}.vault{max-width:340px;margin:0 auto}
    .foot-grid{grid-template-columns:1fr 1fr}.foot-brand{grid-column:span 2}
    .section{padding:80px 0}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
    .hero h1 .w,.hero p.sub,.cta-row,.notify,.demo{opacity:1}
  }

  /* ---------- admin ---------- */
  .admin-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .admin-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:34px}
  .admin-h1{font-family:var(--display);font-weight:600;font-size:1.7rem;letter-spacing:-.02em;margin-top:14px}
  .admin-sub{color:var(--muted);font-size:.98rem;margin-top:6px;margin-bottom:22px}
  .admin-label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 0 7px}
  .admin-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--text);font-family:var(--body);font-size:15px;outline:none;transition:border-color .2s}
  .admin-input:focus{border-color:var(--primary)}
  .admin-btn{width:100%;margin-top:22px;justify-content:center}
  .admin-error{color:#ff6b8a;font-size:14px;margin-top:14px}
  .admin-back{display:inline-block;margin-top:20px;color:var(--muted);font-size:14px}
  .admin-back:hover{color:var(--text)}
  .admin-dash{min-height:100vh}
  .admin-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);background:rgba(10,14,32,.6)}

/* stylised (non-scannable) QR motif */
function QR(){
  const N=13;
  const cells=[];
  const finder=(r,c)=> (r<3&&c<3)||(r<3&&c>=N-3)||(r>=N-3&&c<3);
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const mid=r>=5&&r<=7&&c>=5&&c<=7; // clear centre for badge
    if(finder(r,c)||mid)continue;
    if(rnd()>.55)cells.push(<rect key={r+'-'+c} x={c*13.8} y={r*13.8} width="10.5" height="10.5" rx="2.5" fill="#0A0E20"/>);
  }
  const F=(x,y)=>[
    <rect key={'a'+x+y} x={x} y={y} width="38" height="38" rx="9" fill="#0A0E20"/>,
    <rect key={'b'+x+y} x={x+7} y={y+7} width="24" height="24" rx="6" fill="#fff"/>,
    <rect key={'c'+x+y} x={x+12} y={y+12} width="14" height="14" rx="4" fill="#6D5EF6"/>,
  ];
  return(
    <svg viewBox="0 0 180 180" width="100%" height="100%">
      {cells}
      {F(0,0)}{F(142,0)}{F(0,142)}
    </svg>
  );
}

function AdminLogin({ onAuthed }){
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState(null);
  const [loading,setLoading]=useState(false);

  const submit=async(e)=>{
    e.preventDefault();
    setError(null); setLoading(true);
    try{
      const res=await fetch(`${ADMIN_API}/admin/login`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username,password}),
      });
      if(!res.ok){
        setError(res.status===401?"Incorrect username or password.":"Could not sign in. Try again.");
        setLoading(false);
        return;
      }
      const data=await res.json();
      if(!data?.token){ setError("Unexpected response from server."); setLoading(false); return; }
      onAuthed(data.token);
    }catch{
      setError("Can't reach the server. Check your connection.");
      setLoading(false);
    }
  };

  return(
    <div className="admin-wrap">
      <div className="admin-card">
        <div className="brand" style={{marginBottom:8}}><div className="badge">PX</div>PayXchange</div>
        <h1 className="admin-h1">Admin sign in</h1>
        <p className="admin-sub">Authorised access only.</p>
        <form onSubmit={submit}>
          <label className="admin-label">Username</label>
          <input className="admin-input" value={username} onChange={e=>setUsername(e.target.value)} autoCapitalize="none" autoComplete="username" required/>
          <label className="admin-label">Password</label>
          <input className="admin-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete="current-password" required/>
          {error && <div className="admin-error">{error}</div>}
          <button className="btn btn-primary admin-btn" type="submit" disabled={loading}>{loading?"Signing in…":"Sign in"}</button>
        </form>
        <a href="#/" className="admin-back">← Back to site</a>
      </div>
    </div>
  );
}

function naira(kobo){ return "₦"+(Number(kobo||0)/100).toLocaleString('en-US'); }
function shortDate(s){ try{ return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }catch{ return ""; } }

function AdminDashboard({ token, onLogout }){
  const [tab,setTab]=useState("overview");
  const [stats,setStats]=useState(null);
  const [rows,setRows]=useState({});
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState(null);

  const authGet=async(path)=>{
    const res=await fetch(`${ADMIN_API}${path}`,{headers:{Authorization:`Bearer ${token}`}});
    if(res.status===401){ throw new Error("session"); }
    if(!res.ok) throw new Error("load");
    return res.json();
  };

  useEffect(()=>{
    let live=true;
    (async()=>{
      setLoading(true); setErr(null);
      try{
        const [s,users,txns,refs,disputes]=await Promise.all([
          authGet("/admin/stats"), authGet("/admin/users"), authGet("/admin/transactions"),
          authGet("/admin/referrals"), authGet("/admin/disputes"),
        ]);
        if(!live) return;
        setStats(s);
        setRows({users,txns,refs,disputes});
      }catch(e){
        if(!live) return;
        if(e.message==="session"){ onLogout(); return; }
        setErr("Could not load dashboard data.");
      }finally{ if(live) setLoading(false); }
    })();
    return ()=>{ live=false; };
  },[token]);

  const tabs=[["overview","Overview"],["users","Users"],["txns","Transactions"],["refs","Referrals"],["disputes","Disputes"]];

  return(
    <div className="admin-dash">
      <div className="admin-topbar">
        <div className="brand"><div className="badge">PX</div>PayXchange <span className="admin-tag">Admin</span></div>
        <button className="btn btn-ghost" onClick={onLogout} style={{padding:'8px 16px'}}>Log out</button>
      </div>
      <div className="wrap" style={{paddingTop:28,paddingBottom:80}}>
        <div className="admin-tabs">
          {tabs.map(([k,label])=>(
            <button key={k} className={"admin-tabbtn"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{label}</button>
          ))}
        </div>

        {loading ? <p className="admin-note">Loading…</p> :
         err ? <p className="admin-error">{err}</p> :
         <React.Fragment>

          {tab==="overview" && stats &&
            <div className="admin-grid">
              <Stat label="Users" value={stats.users}/>
              <Stat label="Transactions" value={stats.txns}/>
              <Stat label="Completed" value={stats.completed}/>
              <Stat label="Volume" value={naira(stats.volumeKobo)}/>
              <Stat label="Qualified referrals" value={stats.referralsQualified}/>
              <Stat label="Open disputes" value={stats.disputesOpen}/>
              <Stat label="Rewards claimed" value={stats.rewardsClaimed}/>
            </div>}

          {tab==="users" &&
            <Table head={["Phone","Name","Verified","Code","Joined"]}
                   rows={(rows.users||[]).map(u=>[u.phone,u.full_name||"—",u.phone_verified?"Yes":"No",u.referral_code||"—",shortDate(u.created_at)])}/>}

          {tab==="txns" &&
            <Table head={["Payer","Payee","Amount","Fee","State","When"]}
                   rows={(rows.txns||[]).map(t=>[t.payer_phone,t.payee_phone,naira(t.amount_kobo),naira(t.fee_kobo),t.state,shortDate(t.created_at)])}/>}

          {tab==="refs" &&
            <React.Fragment>
              <p className="admin-note" style={{marginTop:0,marginBottom:14}}>Verify a claim: a referrer is eligible for ₦15,000 at 50 qualified. "Claimed" means they've already tapped claim in-app.</p>
              <Table head={["Referrer","Phone","Code","Signed up","Qualified","Claimed"]}
                     rows={(rows.refs||[]).map(r=>[
                       r.full_name||"—", r.phone, r.referral_code||"—",
                       String(r.signed_up), String(r.qualified),
                       r.referral_reward_claimed_at?"Yes":(Number(r.qualified)>=50?"ELIGIBLE":"No"),
                     ])}/>
            </React.Fragment>}

          {tab==="disputes" &&
            <Table head={["User","Reason","Status","When"]}
                   rows={(rows.disputes||[]).map(d=>[d.user_phone,d.reason,d.status,shortDate(d.created_at)])}/>}

         </React.Fragment>}
      </div>
    </div>
  );
}

function Stat({label,value}){
  return(<div className="admin-tile"><div className="admin-tile-hint">{label}</div><div className="admin-stat">{value}</div></div>);
}

function Table({head,rows}){
  if(!rows.length) return <p className="admin-note">Nothing here yet.</p>;
  return(
    <div className="admin-tablewrap">
      <table className="admin-table">
        <thead><tr>{head.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

function AdminRoot(){
  const [token,setToken]=useState(null);
  return token
    ? <AdminDashboard token={token} onLogout={()=>setToken(null)}/>
    : <AdminLogin onAuthed={setToken}/>;
}

// Minimal hash router: '#/admin' → admin area, anything else → landing page.
function Root(){
  const [hash,setHash]=useState(window.location.hash);
  useEffect(()=>{
    const on=()=>setHash(window.location.hash);
    window.addEventListener('hashchange',on);
    return()=>window.removeEventListener('hashchange',on);
  },[]);
  const isAdmin=hash.replace(/^#/,'').replace(/^\//,'').toLowerCase().startsWith('admin');
  return isAdmin ? <AdminRoot/> : <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
